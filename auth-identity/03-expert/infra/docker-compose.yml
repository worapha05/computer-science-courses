services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ./03-expert/src/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
