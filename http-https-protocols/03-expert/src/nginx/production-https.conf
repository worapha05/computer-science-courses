# Production-oriented NGINX reference for HTTPS + HTTP/2 + HTTP/3
# Replace paths, domain, and upstream before use.
# Requires NGINX build with ssl, http2, and (for h3) quic/http_v3 modules.

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Rate limit zones (application-layer flood mitigation) ---
    limit_req_zone  $binary_remote_addr zone=perip:20m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=addr:20m;

    # --- Upstream app (HTTP/1.1 keepalive) ---
    upstream app_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;
        return 301 https://example.com$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        # HTTP/3 (QUIC) — uncomment when build supports it
        # listen 443 quic reuseport;
        # listen [::]:443 quic reuseport;

        server_name example.com;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # Session resumption
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Advertise HTTP/3 (when quic listener enabled)
        # add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

        # Timeouts against Slowloris-style stalls
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_requests 1000;

        client_max_body_size 4m;

        location / {
            limit_req zone=perip burst=40 nodelay;
            limit_conn addr 40;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /static/ {
            alias /var/www/example/static/;
            expires 7d;
            add_header Cache-Control "public";
            # access_log off;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
