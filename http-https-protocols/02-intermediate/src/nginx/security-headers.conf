# Include inside a server { } block after TLS is configured.
# Example: include /etc/nginx/snippets/security-headers.conf;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Cookies should be set by the application with Secure; HttpOnly; SameSite=...
# If using proxy_cookie_flags (NGINX 1.19.3+):
# proxy_cookie_flags ~ Secure HttpOnly SameSite=Lax;
