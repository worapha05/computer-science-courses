# Lab / reference NGINX TLS server block
# Place certificates from ../certs (fullchain.pem + server.key.pem)
#
# Test config:  nginx -t -c /path/to/this/file   (adjust paths)
# Or include from your main nginx.conf

worker_processes auto;
error_log /tmp/nginx-bootcamp-error.log warn;
pid /tmp/nginx-bootcamp.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # TLS lab server
    server {
        listen 8443 ssl;
        # Uncomment if your NGINX build supports HTTP/2 on this listen:
        # listen 8443 ssl http2;
        server_name localhost;

        ssl_certificate     /path/to/http-https-protocols-bootcamp/02-intermediate/src/certs/fullchain.pem;
        ssl_certificate_key /path/to/http-https-protocols-bootcamp/02-intermediate/src/certs/server.key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!3DES;

        # Session resumption (tickets) — tune for multi-node carefully
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            default_type text/plain;
            return 200 "NGINX TLS lab OK\n";
        }

        location /health {
            return 200 "ok\n";
        }
    }

    # Optional: redirect HTTP -> HTTPS
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }
}
