# แนวคิด OpenAPI / API Gateway mapping (ไม่ deploy อัตโนมัติ)
openapi: 3.0.3
info:
  title: Bootcamp Hello API
  version: 1.0.0
paths:
  /hello:
    get:
      summary: Hello via query string
      parameters:
        - in: query
          name: name
          schema:
            type: string
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:REGION:lambda:path/2015-03-31/functions/ARN/invocations
      responses:
        '200':
          description: OK
    options:
      summary: CORS preflight
      responses:
        '204':
          description: No Content
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
            Access-Control-Allow-Methods:
              schema: { type: string }
            Access-Control-Allow-Headers:
              schema: { type: string }

# GCP API Gateway / Cloud Endpoints จะใช้ backend:
# address: https://REGION-PROJECT.cloudfunctions.net/hello
